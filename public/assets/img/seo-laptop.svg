<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" fill="none">
  <defs>
    <filter id="shadowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#043B2A" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="bakeryHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE1D2"/>
      <stop offset="1" stop-color="#FFC9AE"/>
    </linearGradient>
    <linearGradient id="rankBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C7C5A"/>
      <stop offset="1" stop-color="#043B2A"/>
    </linearGradient>
  </defs>

  <!-- decorative -->
  <circle cx="66" cy="70" r="30" fill="#E4FF6A" opacity="0.75"/>
  <circle cx="566" cy="430" r="20" fill="#0C7C5A" opacity="0.22"/>

  <!-- ranking card -->
